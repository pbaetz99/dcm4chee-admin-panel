# Listener plain, http level: only the Referer rule of the optional dcm4chee UI section (no redirect server).
# Plain http is for a first look through an SSH tunnel to 127.0.0.1 only, never for a network: passwords and
# patient data would travel unencrypted.
# The browser puts the port into the Referer, so the pattern names it: http://HOST:8080/. Use the same port at both
# ends of the tunnel (ssh -L 8080:127.0.0.1:8080 ...), or change 8080 here.
map "$host $http_referer" $pacs_dcm4chee_ui {
    "~^(\S+) http://\1:8080/dcm4chee-arc/ui2/"  1;
    default                                     0;
}
