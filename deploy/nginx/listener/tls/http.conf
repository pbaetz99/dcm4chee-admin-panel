# Listener tls, http level: port 80 only redirects to https (host port 80 -> container 8080), and the Referer rule of the
# optional dcm4chee UI section.
server {
    listen 8080 default_server;
    server_name _;
    access_log off;
    return 301 https://$host$request_uri;
}

# dcm4chee UI section: nginx recognises calls of the UI by the Referer https://HOST/dcm4chee-arc/ui2/. The host in
# the Referer must be $host of the request (\1), without a port: browsers leave out the default port 443. A Referer with
# a port (another page on the same name, for example Portainer on 9443), another host, http or no Referer gives 0 and
# the call goes to the locked locations. If users open the PACS on another port, put it into the pattern: https://\1:8443/
map "$host $http_referer" $pacs_dcm4chee_ui {
    "~^(\S+) https://\1/dcm4chee-arc/ui2/"  1;
    default                                 0;
}
