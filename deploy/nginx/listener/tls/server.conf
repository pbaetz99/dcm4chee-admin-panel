# Listener tls, server level: https (host port 443 -> container 8443). The certificate is set at the end of this file.
# Host nginx: replace 8080 by 80 and 8443 by 443 here and in http.conf (README.md).
listen 8443 ssl default_server;
# nginx 1.25.1 or newer. Older (Debian 12 has 1.22): delete the next line and write "ssl http2" in the listen line above.
http2 on;
ssl_protocols TLSv1.2 TLSv1.3;
set $pacs_scheme https;                            # what the browser used; arc and oauth2-proxy are told

# Certificate: file with the full chain (server certificate first) and its key. Only this listener has these lines, so plain
# and behind-proxy start without a tls folder. Host nginx with Let's Encrypt: /etc/letsencrypt/live/YOURNAME/fullchain.pem and privkey.pem.
ssl_certificate     /etc/nginx/tls/server.crt;
ssl_certificate_key /etc/nginx/tls/server.key;
