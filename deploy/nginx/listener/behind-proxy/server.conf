# Listener behind-proxy, server level: http on container port 8080 behind a proxy that ends TLS and passes the client address.
# Reach nginx ONLY from that proxy (own Docker network, no published port): the proxy network below is trusted to say who
# the client is, from anywhere else X-Forwarded-For would be a forgery. Audit log, firewall check and network lists then
# see the real client.
set_real_ip_from 203.0.113.1;                      # CHANGE-ME: the address of the proxy container (docker inspect PROXY), at most its network. This documentation address trusts nobody: left unchanged, the audit log shows the proxy for every client.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
listen 8080 default_server;
set $pacs_scheme https;                            # the proxy ends TLS: arc and oauth2-proxy are told https
