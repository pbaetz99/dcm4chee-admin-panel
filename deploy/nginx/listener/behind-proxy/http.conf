# Listener behind-proxy, http level: only the Referer rule of the optional dcm4chee UI section (no redirect server).
# The proxy in front (Traefik, Caddy, Apache, Cloudflare Tunnel) ends TLS, so the browser's Referer is https://HOST/ and
# the proxy must pass the Host header unchanged (Apache: ProxyPreserveHost On). If the proxy listens on another port
# than 443, put it into the pattern: https://\1:8443/
map "$host $http_referer" $pacs_dcm4chee_ui {
    "~^(\S+) https://\1/dcm4chee-arc/ui2/"  1;
    default                                 0;
}
