# Optional dcm4chee UI section: the dcm4chee user interface behind the same login, admins only, without Keycloak.
# Switch it off by deleting this file (pacs/optional/dcm4chee-ui.conf) and reloading nginx; nothing else changes.
# Requirement: arc runs without Keycloak (image dcm4chee-arc-psql, not -secure or -secure-ui). Block arc (8080/8443)
# from outside (tab Firewall).
# Entry /dcm4chee-arc/ui2/ (link in /admin/). After that the UI calls any address below /dcm4chee-arc/, always with
# the Referer https://THISHOST/dcm4chee-arc/ui2/...; the rewrite below sends those calls to /_dcm4chee/, where
# everything is allowed (map $pacs_dcm4chee_ui of the listener). The locks and X-PACS-Admin of the admin page do not
# apply here: the UI is the tool of the vendor. Changes (all except GET/HEAD/OPTIONS) are logged with the account.
# These locations do not send the cross-origin isolation headers (the UI loads from other places).

# Before the location is chosen: calls of the UI go to the full interface
if ($pacs_dcm4chee_ui) {
    rewrite ^/dcm4chee-arc/ /_dcm4chee$uri last;
}

location = /dcm4chee {
    return 301 /dcm4chee-arc/ui2/;
}
# Entry: dcm4chee delivers only a redirect script without a Content-Type here (some browsers do not run it). The same
# script with a type, default language German. It first deletes a Keycloak setting the browser remembers for the UI
# (else the UI jumps to Keycloak although keycloak.json is empty).
location = /dcm4chee-arc/ui2/ {
    default_type text/html;
    add_header Cache-Control no-cache always;
    return 200 "<!doctype html><script>Object.keys(localStorage).forEach(function(k){if(k.indexOf('keycloak_config_')===0||k.indexOf('kc-callback-')===0)localStorage.removeItem(k);});var l=localStorage.getItem('current_language')||'de';location.replace('/dcm4chee-arc/ui2/'+l+'/index.html');</script>";
}
# The UI asks for keycloak.json: empty = no Keycloak, else it redirects to Keycloak. arc answers with defaults even
# without Keycloak, so nginx answers itself (both ways, with and without Referer).
location = /dcm4chee-arc/ui2/rs/keycloak.json {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 200 '{}';
}
location = /_dcm4chee/dcm4chee-arc/ui2/rs/keycloak.json {
    internal;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 200 '{}';
}
location ^~ /dcm4chee-arc/ui2/ {
    include /etc/nginx/conf.d/pacs/login/admin.conf;
    proxy_pass $arc$request_uri;
    include /etc/nginx/conf.d/pacs/proxy.conf;
    add_header Cache-Control no-cache always;
}
location ^~ /_dcm4chee/ {
    internal;
    include /etc/nginx/conf.d/pacs/login/admin.conf;
    client_max_body_size 0;                        # upload of DICOM through the UI
    client_body_buffer_size 64k;                   # small changes (JSON) are in the audit log with their content
    access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=zugriffe pacs;
    access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=ereignisse pacs if=$pacs_ereignis;
    access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=admin pacs_admin if=$pacs_aendernd;
    proxy_pass $arc$request_uri;                   # the address unchanged (encoded characters like %5E stay)
    include /etc/nginx/conf.d/pacs/proxy.conf;
    proxy_read_timeout 600s;
    add_header Cache-Control no-store always;
}
