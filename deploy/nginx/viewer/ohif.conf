# Viewer ohif: the OHIF static files of the image, and the DICOMweb reads only the viewer needs (series, instances, WADO).
# Included last in the server block of pacs.conf. AE titles: see the top of pacs.conf.
root /usr/share/nginx/html;                        # OHIF from the image
gzip_static on;
gunzip on;

location / {
    try_files $uri $uri/ /index.html;
}

# Never serve the start page unchecked from the browser cache: an old index.html loads its scripts without a session,
# gets only redirects to the login and the page stays blank
location = /index.html {
    add_header Cache-Control no-cache;
    include /etc/nginx/conf.d/pacs/headers.conf;
}

# Serve the own app-config.js (data source /dcm4chee-arc/aets/DCM4CHEE/rs), not the app-config.js.gz of the image
location = /app-config.js {
    gzip_static off;
    add_header Cache-Control no-cache;
    include /etc/nginx/conf.d/pacs/headers.conf;
}

# QIDO/WADO-RS on studies, series and instances, and WADO-URI, GET only. Everything else of dcm4chee (worklist,
# control, changes) is not reachable through this. (The exact study search is in pacs.conf, the page needs it too.)
location ~ ^/dcm4chee-arc/aets/DCM4CHEE/(rs/(studies|series|instances)|wado)(/|$) {
    limit_except GET { deny all; }
    proxy_pass $arc;
    include /etc/nginx/conf.d/pacs/proxy.conf;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    include /etc/nginx/conf.d/pacs/headers.conf;
}
