# Login none, http level: the account name for the audit log and for X-Auth-User. There are no accounts, so the name is the
# client address (anon-ADDRESS); never taken from a request header, a client could write anything there.
map $remote_addr $pacs_user {
    default  "anon-$remote_addr";
}
map $remote_addr $pacs_sub {
    default  "anon-$remote_addr";
}
