# Login none, locations: account label for the admin page (it reads /oauth2/userinfo, field preferredUsername).
# A "return" in the location itself would answer before the network list is checked (it runs earlier), so the answer is
# given by a named location that try_files reaches only after the check.
location = /oauth2/userinfo {
    try_files /nonexistent @pacs_userinfo;
}
location @pacs_userinfo {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 200 '{"preferredUsername":"$pacs_user"}';
}
