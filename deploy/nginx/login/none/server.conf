# Login none, server level: NO LOGIN. Only these networks may use the viewer and read; everybody else gets 403.
# /admin/, the dcm4chee UI section and every change need the narrower list of admin.conf. Keep both lists small.
# Behind an SSH tunnel to a published port 127.0.0.1:8080 nginx sees the Docker gateway, not your PC: allow that one address.
allow 192.0.2.0/24;                                # CHANGE-ME: the network of the PCs that may open the viewer
deny all;
