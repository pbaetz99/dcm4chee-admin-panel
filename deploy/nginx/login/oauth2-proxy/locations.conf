# Login oauth2-proxy, locations: sign in, the checks of every request, account name. Values come from site.conf.

# Sign in, return from the provider (/oauth2/callback), sign out, userinfo (account name at the top of /admin/)
location /oauth2/ {
    auth_request off;
    proxy_pass $pacs_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # never pass the browser's own chain on
    proxy_set_header X-Forwarded-Proto $pacs_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
}

# Check of every request: logged in and in one of the --allowed-group of oauth2-proxy. With a variable in proxy_pass
# always give a fixed URI, else the original URI goes along. An auth subrequest has its own client_max_body_size, taken
# against the body of the main request: without 0 here an upload of more than 1 MB ends in HTTP 500.
location = /oauth2/auth {
    internal;
    client_max_body_size 0;
    proxy_pass $pacs_auth/oauth2/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $pacs_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
}

# Check for /admin/ and all changes: the admin group only ($pacs_admin_group in site.conf, the only place of the group).
# An empty group would let every logged-in account in (oauth2-proxy then applies no group check): refuse instead.
location = /oauth2/auth-admin {
    internal;
    if ($pacs_admin_group = "") { return 500; }
    client_max_body_size 0;
    proxy_pass $pacs_auth/oauth2/auth?allowed_groups=$pacs_admin_group;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $pacs_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
}
