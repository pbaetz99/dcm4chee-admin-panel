# Login oauth2-proxy, server level: every request needs a valid session; the account comes back in response headers.
auth_request /oauth2/auth;
auth_request_set $pacs_login $upstream_http_x_auth_request_preferred_username;   # -> $pacs_user (login/http.conf)
auth_request_set $pacs_email $upstream_http_x_auth_request_email;
auth_request_set $pacs_sub   $upstream_http_x_auth_request_user;
error_page 401 = /oauth2/start;
