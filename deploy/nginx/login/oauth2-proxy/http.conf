# Login oauth2-proxy, http level: the account name for the audit log and for X-Auth-User, never empty.
# preferred_username; some providers (for example Google) do not send it, then the e-mail; then the user ID that
# oauth2-proxy reports (header X-Auth-Request-User, log field sub);
# a request that was refused before the login check ran is logged as anon-CLIENTADDRESS.
# $pacs_login, $pacs_email and $pacs_sub are set by auth_request_set in server.conf (oauth2-proxy --set-xauthrequest).
map $pacs_login $pacs_user_mail {
    ""       $pacs_email;
    default  $pacs_login;
}
map $pacs_user_mail $pacs_user_sub {
    ""       $pacs_sub;
    default  $pacs_user_mail;
}
map $pacs_user_sub $pacs_user {
    ""       "anon-$remote_addr";
    default  $pacs_user_sub;
}
