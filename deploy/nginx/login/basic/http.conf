# Login basic, http level: the account name for the audit log and for X-Auth-User, never empty.
# $remote_user is the name the client CLAIMED (also for a failed login), so a 401 row names the claimed account. A request
# without credentials (answered 401) is logged as anon-CLIENTADDRESS.
map $remote_user $pacs_user {
    ""       "anon-$remote_addr";
    default  $remote_user;
}
map $pacs_user $pacs_sub {
    default  $pacs_user;
}
# The same name made safe for the JSON of the account label (/oauth2/userinfo): a name with a quote, backslash or
# control character is shown as ? instead of breaking the JSON.
map $pacs_user $pacs_user_json {
    "~[\x00-\x1f\x22\x5c\x7f]"  "?";
    default                     $pacs_user;
}
