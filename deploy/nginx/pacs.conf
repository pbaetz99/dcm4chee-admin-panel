# nginx core of the PACS admin panel (and optional OHIF viewer); never edit this file, edit pacs/site.conf instead.
#
# Container: mount the folder that holds this file as /etc/nginx/conf.d (read only); host nginx: copy it there. nginx loads
# the *.conf files of that folder inside the http block, so this file sits in http. Everything that depends on your site
# or on your choices is included from the subfolder pacs/ (/etc/nginx/conf.d/pacs/):
#   site.conf            your values: server_name, arc, certificate, admin group (the only file you edit on nginx 1.25.1 or newer)
#   listener/*.conf      how browsers reach nginx: tls | plain | behind-proxy (one folder of deploy/nginx/listener/)
#   login/*.conf         how users log in: oauth2-proxy | basic | none (one folder of deploy/nginx/login/)
#   viewer.conf          OHIF viewer, or none = admin panel only (one file of deploy/nginx/viewer/)
#   optional/*.conf      dcm4chee UI section; delete the file to switch it off
#   proxy.conf headers.conf audit-write.conf   shared pieces, identical for every choice (deploy/nginx/common/)
# deploy/nginx/README.md lists the copy commands per setup.
#
# Paths inside the container (the compose file mounts them):
#   /srv/pacs-admin/admin/            web/admin of this repository, read only
#   /srv/pacs-admin/status/           status.json of dashboard-status.py (host: $PACS_ADMIN_VAR/status), read only
#   /run/pacs-admin/verwaltung.sock   helper service verwaltung-dienst.py (host: PACS_SOCKET)
#   /run/pacs-admin/protokoll.sock    audit log input of the helper service (host: PACS_LOG_SOCKET)
#   /etc/nginx/tls/                   server.crt and server.key (listener tls)
#   /etc/nginx/htpasswd/              users and admins (login basic)
# The helper service creates both sockets owned by PACS_SOCKET_UID, which must be the uid of the nginx worker processes.
#
# AE titles: DCM4CHEE (archive) and IOCM_QUALITY (view of rejected studies) occur in this file and in pacs/viewer.conf
# only: grep -n 'DCM4CHEE\|IOCM_QUALITY' pacs.conf pacs/viewer.conf   (99DCM4CHEE is a coding scheme, not an AE title).
# They must match aet and iocmAet in web/admin/config.js and ARC_AET in /etc/default/pacs-admin.


# ---- Audit log ---------------------------------------------------------------------------------------------------
# nginx sends every log line as a syslog datagram to the helper service, which stores it encrypted (pacsdb.py).
# Tags: zugriffe = every request, ereignisse = searches and opened studies, admin = changes. The helper reads the
# field names: do not rename them. Nothing goes to "docker logs" on purpose (patient data in the URLs); for debugging
# add "access_log /dev/stdout pacs;" to the server block for a while.
# u = account name, sub = the user ID that the login reports (oauth2-proxy: header X-Auth-Request-User, empty without a
# checked session); $pacs_user is never empty (login/http.conf).
log_format pacs escape=json '{"t":"$time_iso8601","u":"$pacs_user","sub":"$pacs_sub","ip":"$remote_addr","r":"$request_uri","status":$status}';
# Changes (tag admin): plus method, description from the page (k, URL-encoded from X-PACS-Admin) and the new values
# (body, only if the content fits into client_body_buffer_size)
log_format pacs_admin escape=json '{"t":"$time_iso8601","u":"$pacs_user","sub":"$pacs_sub","ip":"$remote_addr","r":"admin","m":"$request_method","uri":"$request_uri","status":$status,"k":"$http_x_pacs_admin","body":"$request_body"}';

# Login: defines $pacs_user and $pacs_sub for the audit log and for X-Auth-User
include /etc/nginx/conf.d/pacs/login/http.conf;

# Events: searches for studies and patients (also of the rejected studies), series list (= study opened), metadata,
# WADO-URI, GET only. /_dcm4chee: the same calls from the dcm4chee UI (after the rewrite in optional/dcm4chee-ui.conf;
# there POST .../rs/studies is an upload, not a search). AE titles: see the top of this file.
map "$request_method $uri" $pacs_ereignis {
    "~^GET (/_dcm4chee)?/dcm4chee-arc/aets/(DCM4CHEE/rs/(studies(/[^/]+/series)?|patients)|IOCM_QUALITY/rs/studies)$"  1;
    "~^GET (/_dcm4chee)?/dcm4chee-arc/aets/DCM4CHEE/rs/studies/.+/instances/[^/]+/metadata$"                           1;
    "~^GET (/_dcm4chee)?/dcm4chee-arc/aets/DCM4CHEE/wado$"                                                              1;
    default                                                                                                             0;
}

# /admin/dienst/: every POST and the GETs below that change something need X-PACS-Admin (only the admin page sets it),
# only POSTs go to the admin log
map "$request_method:$http_x_pacs_admin" $pacs_post_ohne_admin {
    "POST:"  1;
    default  0;
}
map $request_method $pacs_ist_post {
    POST     1;
    default  0;
}
# GET calls to /admin/dienst/ that change something need X-PACS-Admin like the POSTs (only the admin page sets it, a
# cross-site GET cannot): /admin/dienst/platten and /admin/dienst/firewall?neu=1. Matched on the raw target, exactly as
# the helper service compares it (verwaltung-dienst.py do_GET), so keep proxy_pass there without a URI part.
map "$request_method $request_uri" $pacs_dienst_get_wirkt {
    "~^GET /admin/dienst/platten$"           1;
    "~^GET /admin/dienst/firewall\?neu=1$"   1;
    default                                  0;
}
map "$pacs_dienst_get_wirkt:$http_x_pacs_admin" $pacs_dienst_get_ohne_admin {
    "1:"     1;
    default  0;
}

# Study list newest first: OHIF sends no order and sorts only the loaded page, dcm4chee returns the oldest first
# without orderby
map $arg_orderby $pacs_orderby {
    ""      "&orderby=-StudyDate,-StudyTime";
    default "";
}

# dcm4chee UI section: everything except reading goes to the admin log
map $request_method $pacs_aendernd {
    GET      0;
    HEAD     0;
    OPTIONS  0;
    default  1;
}

# Listener (http level): http to https redirect for tls, and the Referer rule of the dcm4chee UI section
include /etc/nginx/conf.d/pacs/listener/http.conf;


server {
    include /etc/nginx/conf.d/pacs/site.conf;                 # server_name, arc, resolver, certificate, admin group
    include /etc/nginx/conf.d/pacs/listener/server.conf;      # listen, TLS or real client address, $pacs_scheme

    server_tokens off;
    # the session is in the cookie; with many groups in the token it gets big
    large_client_header_buffers 4 16k;
    # redirects relative (/admin -> /admin/), else nginx names the container port
    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;

    # Path parameters (";") and backslashes (raw or %5c) are not normalised by nginx but may be by the upstream: "..;/..;/"
    # or "..\..\" could walk out of an allowed path. dcm4chee needs none of them in a path (the query string is not checked).
    # \x5c is the backslash for the regex: nginx keeps a backslash in quotes unchanged when an x follows it.
    if ($request_uri ~* "^[^?]*(;|%5c|\x5c)") { return 400; }

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/dicom+json application/javascript text/css;

    # Audit log for everything without an access_log of its own (path = PACS_LOG_SOCKET in the container). The upstream
    # names (arc, oauth2-proxy) are resolved per request with the resolver of site.conf: re-created containers get a new IP.
    access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=zugriffe pacs;
    access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=ereignisse pacs if=$pacs_ereignis;

    # Login: the check every request has to pass (auth_request, auth_basic or a network list), sets the account
    include /etc/nginx/conf.d/pacs/login/server.conf;

    # Cross-origin isolation for locations without an add_header of their own
    include /etc/nginx/conf.d/pacs/headers.conf;

    # Login locations: oauth2-proxy endpoints, or the account label of the admin page
    include /etc/nginx/conf.d/pacs/login/locations.conf;

    # Everything below /dcm4chee-arc/ that is not allowed explicitly further down
    location /dcm4chee-arc/ {
        return 404;
    }

    # Optional dcm4chee UI section (rewrite for calls of the UI and its locations). Absent file = section off.
    include /etc/nginx/conf.d/pacs/optional/*.conf;

    # ---- Admin panel /admin/, admin accounts only --------------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }
    # the page itself (index.html, admin.css, config.js)
    location /admin/ {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        alias /srv/pacs-admin/admin/;
        add_header Cache-Control no-cache;
        include /etc/nginx/conf.d/pacs/headers.conf;
    }
    # Numbers for the overview (status.json of dashboard-status.py, by cron every 5 minutes), no patient data
    location /admin/daten/ {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        alias /srv/pacs-admin/status/;
        gzip_static off;                           # a status.json.gz next to status.json must never be served instead
        add_header Cache-Control no-store always;   # always the current state
        include /etc/nginx/conf.d/pacs/headers.conf;
    }
    # Helper service on the host (verwaltung-dienst.py, systemd pacs-verwaltung) over the unix socket: disks, firewall,
    # read the audit log. It knows the account only from X-Auth-User and the PC from X-Real-IP (firewall: do not lock
    # out your own PC); both come from proxy.conf. Behind another proxy $remote_addr is wrong unless the listener
    # behind-proxy restores the client address.
    location ^~ /admin/dienst/ {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        limit_except GET POST { deny all; }
        if ($pacs_post_ohne_admin) { return 403; }
        if ($pacs_dienst_get_ohne_admin) { return 403; }   # GETs that change something need X-PACS-Admin too
        client_max_body_size 64k;        # firewall: all rules in one request
        client_body_buffer_size 64k;
        access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=zugriffe pacs;
        access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=admin pacs_admin if=$pacs_ist_post;
        proxy_pass http://unix:/run/pacs-admin/verwaltung.sock:;
        proxy_http_version 1.0;          # the helper answers HTTP/1.0 and closes
        include /etc/nginx/conf.d/pacs/proxy.conf;
        add_header Cache-Control no-store always;
        include /etc/nginx/conf.d/pacs/headers.conf;
    }

    # ---- dcm4chee calls of the admin page, with locks against mistakes ----------------------------------------------
    # Changes need the header X-PACS-Admin (only the admin page sets it, a foreign page cannot without CORS) and are
    # logged with account, PC, request and new values (tag admin). Locks:
    #   - change a study only with exactly one StudyInstanceUID (without it dcm4chee changes ALL studies)
    #   - move a study only with updatePolicy=PRESERVE (else dcm4chee overwrites the target patient)
    #   - change a patient never with merge (there it means merge)
    #   - delete for good only through IOCM_QUALITY, where dcm4chee deletes rejected studies only
    # Study change and study move accept exactly the query string the admin page sends, nothing more. A deny list cannot
    # be complete: dcm4chee-arc 5.35.1 also reads a filter by its hex tag (0020000D for the study UID) and takes several
    # studies from a second StudyInstanceUID or a comma list, while nginx ($arg_x) is case-insensitive and sees only the
    # first occurrence. Patient edit refuses every "merge" (any case) and any percent-encoded argument name.
    # These regex locations must stay above viewer.conf (the first matching regex wins).
    # AE titles: see the top of this file.

    # read: patients, rejected studies (view of the AE IOCM_QUALITY)
    location ~ ^/dcm4chee-arc/aets/(DCM4CHEE/rs/patients|IOCM_QUALITY/rs/studies)$ {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        limit_except GET { deny all; }
        proxy_pass $arc;
        include /etc/nginx/conf.d/pacs/proxy.conf;
        add_header Cache-Control no-store always;
        include /etc/nginx/conf.d/pacs/headers.conf;
    }
    # reject (113001^DCM), restore, merge
    location ~ "^/dcm4chee-arc/aets/(DCM4CHEE/rs/studies/[0-9.]+/reject/113001\^DCM|IOCM_QUALITY/rs/studies/[0-9.]+/reject/REVOKE_REJECTION\^99DCM4CHEE|DCM4CHEE/rs/patients/[^/]+/merge/[^/]+)$" {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        limit_except POST { deny all; }
        if ($http_x_pacs_admin = "") { return 403; }
        include /etc/nginx/conf.d/pacs/audit-write.conf;
        proxy_pass $arc;
        include /etc/nginx/conf.d/pacs/proxy.conf;
        add_header Cache-Control no-store always;
        include /etc/nginx/conf.d/pacs/headers.conf;
    }
    # edit a study: exactly one study, exactly the query string of the admin page
    location = /dcm4chee-arc/aets/DCM4CHEE/rs/studies/update {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        limit_except POST { deny all; }
        if ($http_x_pacs_admin = "") { return 403; }
        if ($args !~ "^reasonForModification=[A-Za-z_]+&StudyInstanceUID=[0-9.]{1,64}$") { return 403; }
        client_body_buffer_size 64k;
        include /etc/nginx/conf.d/pacs/audit-write.conf;
        proxy_pass $arc;
        include /etc/nginx/conf.d/pacs/proxy.conf;
        add_header Cache-Control no-store always;
        include /etc/nginx/conf.d/pacs/headers.conf;
    }
    # study to another patient: the target patient stays unchanged. The query string is what the admin page sends:
    # PatientID=<encodeURIComponent>[&IssuerOfPatientID=<encodeURIComponent>]&updatePolicy=PRESERVE
    location ~ "^/dcm4chee-arc/aets/DCM4CHEE/rs/studies/[0-9.]+/patient$" {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        limit_except POST { deny all; }
        if ($http_x_pacs_admin = "") { return 403; }
        if ($args !~ "^PatientID=[A-Za-z0-9_.!~*'()%-]+(&IssuerOfPatientID=[A-Za-z0-9_.!~*'()%-]+)?&updatePolicy=PRESERVE$") { return 403; }
        include /etc/nginx/conf.d/pacs/audit-write.conf;
        proxy_pass $arc;
        include /etc/nginx/conf.d/pacs/proxy.conf;
        add_header Cache-Control no-store always;
        include /etc/nginx/conf.d/pacs/headers.conf;
    }
    # edit a patient: the whole record by PUT, never merge
    location ~ "^/dcm4chee-arc/aets/DCM4CHEE/rs/patients/[^/]+$" {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        limit_except PUT { deny all; }
        if ($http_x_pacs_admin = "") { return 403; }
        if ($args ~* "(^|[&;])merge([=&;]|$)") { return 403; }   # ';' counts as a separator too
        if ($args ~ "(^|&)[^=&]*%") { return 403; }
        client_body_buffer_size 64k;
        include /etc/nginx/conf.d/pacs/audit-write.conf;
        proxy_pass $arc;
        include /etc/nginx/conf.d/pacs/proxy.conf;
        add_header Cache-Control no-store always;
        include /etc/nginx/conf.d/pacs/headers.conf;
    }
    # delete a rejected study for good
    location ~ "^/dcm4chee-arc/aets/IOCM_QUALITY/rs/studies/[0-9.]+$" {
        include /etc/nginx/conf.d/pacs/login/admin.conf;
        limit_except DELETE { deny all; }
        if ($http_x_pacs_admin = "") { return 403; }
        include /etc/nginx/conf.d/pacs/audit-write.conf;
        proxy_pass $arc;
        include /etc/nginx/conf.d/pacs/proxy.conf;
        add_header Cache-Control no-store always;
        include /etc/nginx/conf.d/pacs/headers.conf;
    }

    # ---- DICOMweb, read only: study search of the admin page and of OHIF, every logged-in account ------------------
    # Study search (QIDO) newest first, see map $pacs_orderby
    location = /dcm4chee-arc/aets/DCM4CHEE/rs/studies {
        limit_except GET { deny all; }
        proxy_pass $arc$uri?$args$pacs_orderby;
        include /etc/nginx/conf.d/pacs/proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;   # every call goes to the server (audit log), nothing in the PC cache
        include /etc/nginx/conf.d/pacs/headers.conf;
    }

    # Viewer: OHIF and the DICOMweb reads only the viewer needs, or just the redirect to /admin/. Keep this include
    # last: its regex location must come after the locks above.
    include /etc/nginx/conf.d/pacs/viewer.conf;
}
