# Cross-origin isolation for SharedArrayBuffer (OHIF 3D, MPR); included in the server block and in every location that
# has an add_header of its own, because add_header in a location replaces the ones of the server block.
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
add_header Cross-Origin-Resource-Policy same-origin always;
# Optional hardening, off by default: HSTS makes browsers refuse plain http for this name for a year, a mistake with a
# self-signed test certificate is hard to undo. Only with a real certificate, and then also in optional/dcm4chee-ui.conf.
#add_header Strict-Transport-Security "max-age=31536000" always;
