# Audit log of a location that changes data: every request in "zugriffe", every request in "admin" (account, PC, method,
# URL, description from the page, new values). Included in those locations because an access_log in a location replaces
# the ones of the server block. The path is PACS_LOG_SOCKET of the helper service.
access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=zugriffe pacs;
access_log syslog:server=unix:/run/pacs-admin/protokoll.sock,nohostname,tag=admin pacs_admin;
