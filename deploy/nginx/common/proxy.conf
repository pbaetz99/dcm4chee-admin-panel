# Shared proxy headers for every location that talks to arc or to the helper service (included inside the location).
# proxy_set_header is not inherited once a location sets any of its own, so each of them includes this file.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;   # the client address only: a forged chain from the browser is dropped
proxy_set_header X-Forwarded-Proto $pacs_scheme;   # what the browser used (listener), not the hop to nginx
proxy_set_header X-Real-IP         $remote_addr;   # the helper checks it so you cannot lock out your own PC
proxy_set_header X-Auth-User       $pacs_user;     # the helper stores it as the account of a change
proxy_set_header X-PACS-Admin      "";             # only the admin page sets it, never forward it
proxy_set_header Authorization     "";             # basic-auth password or bearer token never reach arc or the helper
proxy_set_header Cookie            "";             # nor does the login session cookie
