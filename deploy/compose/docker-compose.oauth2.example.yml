# Docker Compose file for the PACS admin panel with the OHIF viewer, nginx as the front door and oauth2-proxy as the login.
# Deutsch: docs/login.de.md#login-oauth2
#
# What it is: two containers next to your dcm4chee project, in its Docker network (external, last block), so that nginx
# reaches the container arc by name. ohif is nginx in the OHIF image: viewer, admin panel (/admin/), the calls to arc and to
# the helper service with their locks, and the audit log. ohif-auth is oauth2-proxy: nginx asks it about every request.
# The login is Microsoft Entra ID; the lines marked ENTRA belong to it. A commented block shows the same for another OpenID
# Connect provider (Keycloak, Authentik, Authelia, Zitadel). Google and GitHub: docs/login.md#login-oauth2
# Admin panel without the viewer: image nginx:1.30 for ohif, no entrypoint, command or app-config.js lines (as in
# docker-compose.adminonly.example.yml), and viewer none in the nginx files.
#
# Copy:   cp /opt/pacs-admin/deploy/compose/docker-compose.oauth2.example.yml /opt/ohif/docker-compose.yml
# Start:  cd /opt/ohif && docker compose up -d       Check: docker compose ps, docker logs ohif, docker logs ohif-auth
#
# The folder of this file is /opt/ohif. Before the first start it must hold the items below. For a missing item Docker makes
# an empty folder owned by root and the service behind it does not work (preflight.sh --dir /opt/ohif finds that).
#   nginx/            the nginx files built from deploy/nginx (deploy/nginx/README.md) with login oauth2-proxy, viewer ohif
#                     and listener tls; mounted as /etc/nginx/conf.d
#   tls/              server.crt (full chain, server certificate first) and server.key (docs/install.md#tls-certificate)
#   app-config.js     OHIF configuration: cp /opt/pacs-admin/deploy/app-config.js.example /opt/ohif/app-config.js
#   ohif-auth.env     the secrets of oauth2-proxy, chmod 600, never in this file. Three lines:
#                       OAUTH2_PROXY_CLIENT_ID=<application (client) ID of the app registration>
#                       OAUTH2_PROXY_CLIENT_SECRET=<value of the client secret>
#                       OAUTH2_PROXY_COOKIE_SECRET=<a random string, made with the command below>
#                     python3 -c 'import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
# Outside it: the repository in /opt/pacs-admin (the admin page), /var/lib/pacs-admin/status (written by the cron job) and
# /run/pacs-admin (the sockets of the helper service, docs/install.md#helper-service); all three are mounted below.
#
# Values to change are the lines with the marker comment. List them with
#   grep -n 'CHANGE-M[E]' /opt/ohif/docker-compose.yml        (the brackets keep this header out of the result)
# Replace each value and delete its marker comment; then the same command prints nothing. Six lines: the name of the Docker
# network of dcm4chee (last block; every compose file of this folder has it), the Directory (tenant) ID, the Object IDs of
# the viewer group and of the admin group, the redirect URL (your host name) and the subnet of that Docker network.
# Entra ID app registration: redirect URI https://HOST/oauth2/callback of type Web, token configuration with the claim groups
# (security groups, as group ID). Two groups: viewers (open the viewer) and admins (also /admin/). The ID of the admin group
# is also set in nginx/pacs/site.conf ($pacs_admin_group).
#
# TLS key: nginx reads certificate and key when it starts, and in the OHIF image the nginx master runs as uid 101
# (check: docker exec ohif id). So the key must be readable by uid 101:
#   chown root:101 /opt/ohif/tls/server.key && chmod 640 /opt/ohif/tls/server.key
# root:root with mode 600 stops nginx with "cannot load certificate key". A host account with uid or gid 101 can then read
# the key too (getent passwd 101 and getent group 101 show whether 101 is taken). The folder tls/ must stay readable (755).
#
# Ports: host 80 -> container 8080 (only redirects to https), host 443 -> container 8443. Written as 0.0.0.0 (IPv4 only) on
# purpose: over IPv6 docker-proxy accepts the connection, then nginx sees only the Docker gateway as client address (audit
# log, check against locking yourself out) and the firewall of the admin panel, which is IPv4 only, does not filter it.
# No healthcheck on purpose: nginx writes every request to the audit log, a probe on / would fill it.

services:

  # nginx in the OHIF image: viewer, /admin/, proxy to dcm4chee-arc with the locks, audit log, login check at ohif-auth.
  ohif:
    image: ohif/app:v3.14.0-beta.37   # fixed version: "latest" and "latest-beta" move on. The nginx in it must be 1.25.1+
    container_name: ohif
    restart: unless-stopped
    # start nginx directly: the start script of the image would write a default.conf and repack app-config.js
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "0.0.0.0:80:8080"
      - "0.0.0.0:443:8443"
    volumes:
      # folders, not single files: a replaced single file would keep its old content inside the container
      - ./nginx:/etc/nginx/conf.d:ro
      - ./tls:/etc/nginx/tls:ro
      # OHIF configuration (data source: the archive behind this nginx). A single file: after an edit, docker compose restart
      - ./app-config.js:/usr/share/nginx/html/app-config.js:ro
      # the admin page. /opt/pacs-admin is where the repository was cloned
      - /opt/pacs-admin/web/admin:/srv/pacs-admin/admin:ro
      # status.json of dashboard-status.py (cron), served as /admin/daten/
      - /var/lib/pacs-admin/status:/srv/pacs-admin/status:ro
      # sockets of the helper service (verwaltung.sock, protokoll.sock); read only is enough for sockets. The folder must
      # stay: if it is deleted and created again, the container sees the new one only after a restart
      - /run/pacs-admin:/run/pacs-admin:ro
      - /etc/localtime:/etc/localtime:ro   # local time in the audit log
      # optional: title, AE titles, links, logo and locale of the admin page without changing the repository
      # (copy web/admin/config.js to /opt/ohif/config.js, edit it, delete the "# " in front of the next line)
      # - ./config.js:/srv/pacs-admin/admin/config.js:ro
      # optional: logo from the same address (config.js: logo: '/pacs-logo.svg'); /admin/ sends Cross-Origin-Embedder-Policy
      # require-corp, a logo from another server does not load
      # - ./logo.svg:/usr/share/nginx/html/pacs-logo.svg:ro

  # Login: nginx asks this container for every request (auth_request). No port is published.
  ohif-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: ohif-auth
    restart: unless-stopped
    env_file: ohif-auth.env   # client ID, client secret and cookie secret (see above), never in this file
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command:
      # Provider Microsoft Entra ID. Another OpenID Connect provider: delete the lines marked ENTRA, use the block below.
      - --provider=entra-id                     # ENTRA: the provider
      - --oidc-issuer-url=https://login.microsoftonline.com/TENANT-ID/v2.0   # ENTRA: CHANGE-ME: Directory (tenant) ID
      - --scope=openid email profile            # ENTRA: the groups come from the token configuration, no scope needed
      - --oidc-email-claim=preferred_username   # ENTRA: accounts without a mailbox have no e-mail claim
      - --allowed-group=VIEWER-GROUP-ID         # ENTRA: CHANGE-ME: Object ID of the group that may open the viewer
      - --allowed-group=ADMIN-GROUP-ID          # ENTRA: CHANGE-ME: Object ID of the admin group (also in site.conf)
      - --whitelist-domain=login.microsoftonline.com   # ENTRA: where a sign-out may lead (ends the session at the provider)
      # Another provider (Keycloak, Authentik, Authelia, Zitadel) instead of the ENTRA lines: delete the "# " (hash, space)
      # in front of each "- --" line below and use your values.
      # Groups: the names as they appear in the claim (Keycloak lists them with a leading slash unless "Full group path" is
      # off in its mapper). Per provider, and for Google and GitHub: docs/login.md#login-oauth2
      # - --provider=oidc                         # Keycloak: keycloak-oidc
      # - --oidc-issuer-url=https://idp.example.org/realms/pacs   # the issuer URL of your provider
      # - --scope=openid email profile groups     # without groups if the default scope of your provider has them already
      # - --oidc-groups-claim=groups              # name of the claim with the groups (this is the default)
      # - --oidc-email-claim=preferred_username   # only if some accounts have no e-mail address, else leave the line out
      # - --allowed-group=pacs-viewers
      # - --allowed-group=pacs-admins             # the admin group goes into nginx/pacs/site.conf as well
      # - --whitelist-domain=idp.example.org      # where a sign-out may lead
      # The same for every provider. HOST in the redirect URL is the server_name of nginx/pacs/site.conf; the same address is
      # registered at the provider as redirect URI.
      - --redirect-url=https://pacs.example.org/oauth2/callback   # CHANGE-ME: https://HOST/oauth2/callback
      - --code-challenge-method=S256
      - --email-domain=*
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      # Only requests from this subnet may supply the X-Forwarded-* headers (oauth2-proxy ignores them from other addresses):
      # the Docker network at the bottom of this file, which nginx shares with oauth2-proxy. Show its subnet with
      #   docker network inspect NAME -f '{{(index .IPAM.Config 0).Subnet}}'   (NAME: that network, see preflight.sh)
      # 172.16.0.0/12 covers the usual Docker networks (172.16.x.x to 172.31.x.x); in another range write the subnet shown.
      - --trusted-proxy-ip=172.16.0.0/12        # CHANGE-ME: subnet of the Docker network
      - --set-xauthrequest=true                 # account name for nginx (audit log, X-Auth-User)
      - --skip-provider-button=true
      - --session-cookie-minimal=true           # cookie without tokens, no refresh: the session ends after cookie-expire
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=12h
      - --request-logging=false                 # every request is in the audit log of nginx already
      - --upstream=static://202

# The Docker network of your dcm4chee project: the container arc lives there, and every service of this file joins it.
networks:
  default:
    name: dcm4chee-arc_default   # CHANGE-ME: name of that network (docker network ls; preflight.sh prints it)
    external: true
