# Docker Compose file for a first look at the PACS admin panel on 127.0.0.1 without TLS (SSH tunnel), plain nginx image.
# Deutsch: docs/install.de.md
#
# What it is: one container next to your dcm4chee project, in its Docker network (external, last block), so that nginx
# reaches the container arc by name. ohif is the official nginx image: admin panel (/admin/), the calls to arc and to the
# helper service with their locks, and the audit log; "/" redirects to /admin/, there is no viewer. The login is HTTP basic
# auth done by nginx itself. There is no TLS: the port is published on 127.0.0.1 only, so the panel is reachable from the
# server itself and through an SSH tunnel, never from the network. For daily use take docker-compose.adminonly.example.yml.
#
# Copy:   cp /opt/pacs-admin/deploy/compose/docker-compose.tryit.example.yml /opt/ohif/docker-compose.yml
# Start:  cd /opt/ohif && docker compose up -d       Check: docker compose ps, docker logs ohif
# Open:   on the server http://127.0.0.1:8080/admin/ . From your PC first open the tunnel
#           ssh -L 8080:127.0.0.1:8080 USER@SERVER
#         and browse http://localhost:8080/admin/ . Use the SAME port at both ends of the tunnel: the browser puts the port
#         into the Referer, and the rule of the dcm4chee UI section in nginx names :8080.
#
# The folder of this file is /opt/ohif. Before the first start it must hold the items below. For a missing item Docker makes
# an empty folder owned by root and the service behind it does not work (preflight.sh --dir /opt/ohif finds that).
#   nginx/            the nginx files built from deploy/nginx (deploy/nginx/README.md) with login basic, viewer none and
#                     listener plain; mounted as /etc/nginx/conf.d
#   htpasswd/         the files users (all accounts) and admins (administrators). Make them with
#                       bash /opt/pacs-admin/deploy/tools/pacs-adduser.sh admin NAME
#                     run as root: the files get owner 101 and mode 600, which the nginx workers need. nginx reads them at
#                     every request, so a new account works at once. Without the files nobody gets in: nginx asks for a
#                     password and answers 403 once one is typed (docs/troubleshooting.md#htpasswd-403-500).
# Outside it: the repository in /opt/pacs-admin (the admin page), /var/lib/pacs-admin/status (written by the cron job) and
# /run/pacs-admin (the sockets of the helper service, docs/install.md#helper-service); all three are mounted below.
# There is no viewer: copy web/admin/config.js to /opt/ohif/config.js, set viewerUrl: '' there (hides the Viewer link) and
# delete the "# " in front of the config.js mount below (the hash and the space, else the indentation is wrong).
#
# Values to change are the lines with the marker comment. List them with
#   grep -n 'CHANGE-M[E]' /opt/ohif/docker-compose.yml        (the brackets keep this header out of the result)
# Replace the value and delete the marker comment; then the same command prints nothing. One line: the name of the Docker
# network of dcm4chee (last block; every compose file of this folder has it).
#
# Port: host 127.0.0.1:8080 -> container 8080, plain http. Never write 0.0.0.0 or the address of a network card instead of
# 127.0.0.1: passwords and patient data would travel unencrypted. nginx sees the Docker gateway as the client address here.
# There is no TLS key, so no key permissions to set.
# No healthcheck on purpose: nginx writes every request to the audit log, a probe on / would fill it.

services:

  # plain nginx: /admin/, proxy to dcm4chee-arc with the locks, audit log, basic auth. No entrypoint or command to set.
  ohif:
    image: nginx:1.30   # the tag only gets fixes (checked with 1.30.5); nginx 1.25.1 or newer is needed
    container_name: ohif
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # folders, not single files: a replaced single file would keep its old content inside the container.
      # Mounting a folder over conf.d hides default.conf of the image; the start message "default.conf is not a file or
      # does not exist" is harmless
      - ./nginx:/etc/nginx/conf.d:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
      # the admin page. /opt/pacs-admin is where the repository was cloned
      - /opt/pacs-admin/web/admin:/srv/pacs-admin/admin:ro
      # status.json of dashboard-status.py (cron), served as /admin/daten/
      - /var/lib/pacs-admin/status:/srv/pacs-admin/status:ro
      # sockets of the helper service (verwaltung.sock, protokoll.sock); read only is enough for sockets. The folder must
      # stay: if it is deleted and created again, the container sees the new one only after a restart
      - /run/pacs-admin:/run/pacs-admin:ro
      - /etc/localtime:/etc/localtime:ro   # local time in the audit log
      # optional: title, AE titles, links and locale of the admin page without changing the repository
      # (copy web/admin/config.js to /opt/ohif/config.js, set viewerUrl: '' and edit the rest, then delete the "# " in
      # front of the next line)
      # - ./config.js:/srv/pacs-admin/admin/config.js:ro
      # No logo mount here: Docker cannot add a new file inside the read-only admin folder above (the container would not
      # start). Copy the logo to /opt/pacs-admin/web/admin/logo.svg instead (an extra file there, git pull leaves it) and
      # set logo: '/admin/logo.svg' in config.js

# The Docker network of your dcm4chee project: the container arc lives there, and the service of this file joins it.
networks:
  default:
    name: dcm4chee-arc_default   # CHANGE-ME: name of that network (docker network ls; preflight.sh prints it)
    external: true
